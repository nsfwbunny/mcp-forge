[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-forge"
version = "0.1.0"
description = "The FastAPI-style framework for building MCP servers in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Benni Alencar", email = "benni@mcp-forge.dev" }]
keywords = ["mcp", "model-context-protocol", "llm", "ai", "agents", "tools", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
sse  = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
cli  = ["typer>=0.12"]
web  = ["httpx>=0.28.1"]
dev  = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "httpx>=0.28.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "nest-asyncio>=1.6",
]
all = ["mcp-forge[http,sse,cli,web]"]

[project.urls]
Homepage      = "https://github.com/nsfwbunny/mcp-forge"
Repository    = "https://github.com/nsfwbunny/mcp-forge"
Issues        = "https://github.com/nsfwbunny/mcp-forge/issues"
Documentation = "https://github.com/nsfwbunny/mcp-forge#readme"
Changelog     = "https://github.com/nsfwbunny/mcp-forge/blob/main/CHANGELOG.md"

[project.scripts]
mcp-forge = "mcp_forge.cli.main:app"

[tool.hatch.version]
path = "mcp_forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict         = true
